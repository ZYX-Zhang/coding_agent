<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodingAgent · 编程智能体工作台</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161a23; --panel2: #1c212d; --line: #262c3a;
    --fg: #e6e9f0; --dim: #8b93a7; --faint: #5a6175;
    --model: #a78bfa;          /* 模型输出 */
    --ok: #34d399;             /* 成功 */
    --err: #f87171;            /* 失败 */
    --warn: #fbbf24;           /* 安全确认 */
    --info: #60a5fa;
    --user: #2563eb;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: row; overflow: hidden;
  }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }

  /* ---------- 左侧栏：会话列表 ---------- */
  #sidebar {
    width: 248px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); display: flex;
    flex-direction: column; overflow: hidden;
  }
  .sb-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--line);
  }
  .sb-title { font-size: 12.5px; color: var(--dim); letter-spacing: .5px; }
  #btn-new {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 11px; font-size: 12.5px; cursor: pointer;
  }
  #btn-new:hover { border-color: var(--info); }
  #sess-list {
    list-style: none; flex: 1; overflow-y: auto; margin: 0; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sess {
    position: relative; padding: 9px 30px 9px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); cursor: pointer;
  }
  .sess:hover { border-color: var(--info); }
  .sess.active { border-color: var(--model); background: rgba(167,139,250,.10); }
  .sess-title {
    font-size: 13px; color: var(--fg); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .sess-meta { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .sess-del {
    position: absolute; top: 7px; right: 7px; width: 20px; height: 20px;
    line-height: 18px; text-align: center; padding: 0; border-radius: 5px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    cursor: pointer; font-size: 12px;
  }
  .sess-del:hover { border-color: var(--err); color: var(--err); }
  .sb-foot {
    padding: 8px 12px; border-top: 1px solid var(--line); font-size: 11px;
    color: var(--faint); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 16px; letter-spacing: .5px; }
  .brand span { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .meta { color: var(--dim); font-size: 12px; display: flex; gap: 12px;
          overflow: hidden; white-space: nowrap; }
  .meta b { color: var(--fg); font-weight: 500; }
  .spacer { flex: 1; }
  header button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  header button:hover { border-color: var(--info); }
  header button.on { border-color: var(--warn); color: var(--warn); }

  /* ---------- 统计条 ---------- */
  #statsbar {
    display: flex; gap: 0; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
    overflow-x: auto;
  }
  .stat {
    padding: 6px 16px; border-right: 1px solid var(--line);
    font-size: 12px; color: var(--dim); white-space: nowrap;
  }
  .stat b { color: var(--fg); font-family: var(--mono); font-size: 13px;
            margin-left: 6px; }
  .stat.running b#st-state, #st-state.run { color: var(--info); }
  .stat b#st-state.done { color: var(--ok); }
  #st-state.idle { color: var(--dim); }

  /* ---------- 对话区 ---------- */
  #chat { flex: 1; overflow-y: auto; padding: 18px 0 12px; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px;
          display: flex; flex-direction: column; gap: 10px; }

  .turn-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--faint); font-size: 11.5px; margin: 8px 0 2px;
  }
  .turn-divider::before, .turn-divider::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }

  /* 用户消息 */
  .msg-user {
    align-self: flex-end; max-width: 78%;
    background: var(--user); color: #fff;
    padding: 9px 14px; border-radius: 14px 14px 3px 14px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* 模型输出（紫色） */
  .msg-model {
    max-width: 92%; align-self: flex-start;
    border-left: 3px solid var(--model); padding: 4px 12px;
    color: var(--model); white-space: pre-wrap; word-break: break-word;
  }
  .msg-model .tag { display: block; font-size: 11px; color: var(--faint);
                    letter-spacing: 1px; margin-bottom: 2px; }
  .cursor { display: inline-block; width: 7px; height: 14px;
            background: var(--model); animation: blink 1s infinite;
            vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Markdown 渲染区 ---------- */
  .md { color: var(--fg); font-size: 13.5px; line-height: 1.65;
        white-space: normal; word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 6px 0; }
  .md h1, .md h2, .md h3, .md h4 {
    color: var(--fg); line-height: 1.3; margin: 10px 0 6px; font-weight: 700; }
  .md h1 { font-size: 17px; } .md h2 { font-size: 15.5px; }
  .md h3 { font-size: 14px; } .md h4 { font-size: 13px; }
  .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md a { color: var(--info); }
  .md code {
    font-family: var(--mono); background: var(--panel2);
    border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px;
    font-size: 12.5px; color: #a5d6ff;
  }
  .md pre {
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .md pre code { background: none; border: none; padding: 0; color: var(--fg);
                 font-size: 12.5px; }
  .md blockquote {
    border-left: 3px solid var(--line); margin: 6px 0;
    padding: 2px 12px; color: var(--dim);
  }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .md img { max-width: 100%; border-radius: 6px; }
  .md-fallback { white-space: pre-wrap; }

  /* 工具卡片 */
  .tool {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel2); font-size: 13px;
  }
  .tool-name { font-family: var(--mono); font-weight: 600; }
  .tool-args { color: var(--dim); font-family: var(--mono); font-size: 12px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               flex: 1; }
  .tool-status { font-size: 12px; font-family: var(--mono);
                 white-space: nowrap; }
  .tool.ok   .tool-name { color: var(--ok); }
  .tool.err  .tool-name { color: var(--err); }
  .tool.block .tool-name { color: var(--warn); }
  .spin {
    width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--info); border-radius: 50%;
    animation: rot .7s linear infinite; flex-shrink: 0;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .tool-body { padding: 0; font-size: 12.5px; }
  .tool-body pre {
    font-family: var(--mono); padding: 10px 12px; overflow-x: auto;
    white-space: pre; color: var(--fg); font-size: 12px; line-height: 1.55;
  }

  /* 折叠长输出 */
  details.fold { border-top: 1px solid var(--line); }
  details.fold summary {
    list-style: none; cursor: pointer; padding: 6px 12px;
    color: var(--info); font-size: 12px; user-select: none;
  }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::before { content: "▸ "; }
  details.fold[open] summary::before { content: "▾ "; }

  /* diff 高亮 */
  .diff-line { display: block; font-family: var(--mono); font-size: 12px;
               padding: 0 12px; white-space: pre-wrap; word-break: break-all; }
  .diff-line.add    { background: rgba(52,211,153,.10); color: #86efac; }
  .diff-line.del    { background: rgba(248,113,113,.10); color: #fca5a5; }
  .diff-line.hunk   { color: var(--info); background: rgba(96,165,250,.08); }
  .diff-line.meta   { color: var(--faint); }

  /* 测试统计徽章 */
  .badges { display: flex; gap: 8px; padding: 8px 12px 2px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-family: var(--mono); padding: 2px 10px;
    border-radius: 20px; border: 1px solid;
  }
  .badge.pass { color: var(--ok); border-color: var(--ok);
                background: rgba(52,211,153,.08); }
  .badge.fail { color: var(--err); border-color: var(--err);
                background: rgba(248,113,113,.08); }
  .badge.warn { color: var(--warn); border-color: var(--warn);
                background: rgba(251,191,36,.08); }

  /* diff 行数统计：所有 diff 都展示，类似 git 的实心绿/红 */
  .diff-sum { display: flex; gap: 8px; padding: 8px 12px 2px; flex-wrap: wrap; }
  .diff-sum .badge.add { color: #e6ffec; border-color: #2ea043;
                         background: #238636; }
  .diff-sum .badge.del { color: #ffebe9; border-color: #f85149;
                         background: #da3633; }

  /* 安全确认（琥珀） */
  .card-confirm {
    border: 1px solid var(--warn); background: rgba(251,191,36,.06);
    border-radius: 10px; padding: 12px 14px;
  }
  .card-confirm .ttl { color: var(--warn); font-weight: 600; font-size: 13px; }
  .card-confirm .why { color: var(--fg); font-size: 12.5px; margin: 4px 0; }
  .card-confirm .args {
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    background: var(--panel); border-radius: 6px; padding: 8px 10px;
    margin: 6px 0; white-space: pre-wrap; word-break: break-all;
    max-height: 140px; overflow-y: auto;
  }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btns button {
    border-radius: 7px; border: 1px solid var(--line); cursor: pointer;
    padding: 6px 16px; font-size: 13px; background: var(--panel2);
    color: var(--fg);
  }
  .btns button.allow { border-color: var(--ok); color: var(--ok); }
  .btns button.deny  { border-color: var(--err); color: var(--err); }
  .btns button:disabled { opacity: .45; cursor: default; }
  .verdict { font-size: 12.5px; margin-top: 6px; }
  .verdict.yes { color: var(--ok); } .verdict.no { color: var(--err); }

  /* 问答卡片 */
  .card-ask { border: 1px solid var(--info); background: rgba(96,165,250,.06);
              border-radius: 10px; padding: 12px 14px; }
  .card-ask .ttl { color: var(--info); font-weight: 600; font-size: 13px; }
  .card-ask .q { margin: 4px 0 8px; }
  .ask-row { display: flex; gap: 8px; }
  .ask-row input {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; color: var(--fg); padding: 7px 10px;
    font-size: 13px; outline: none;
  }
  .ask-row input:focus { border-color: var(--info); }
  .ask-row button { border-radius: 7px; border: 1px solid var(--info);
                    background: transparent; color: var(--info);
                    padding: 7px 16px; cursor: pointer; }

  /* 提示条 */
  .alert { border-radius: 10px; padding: 10px 14px; font-size: 13px;
           border: 1px solid; }
  .alert.error   { border-color: var(--err);  color: var(--err);
                   background: rgba(248,113,113,.07); }
  .alert.warning { border-color: var(--warn); color: var(--warn);
                   background: rgba(251,191,36,.07); }
  .alert.session { border-color: var(--line); color: var(--dim);
                   background: var(--panel); }
  .alert.cancel  { border-color: var(--warn); color: #fcd34d;
                   background: rgba(251,191,36,.10); }

  /* 最终摘要（绿色大卡片） */
  .card-finish {
    border: 1px solid var(--ok); background: rgba(52,211,153,.06);
    border-radius: 12px; padding: 14px 16px;
  }
  .card-finish .ttl { color: var(--ok); font-weight: 700; font-size: 14px;
                      display: flex; align-items: center; gap: 8px; }
  .card-finish .sum { margin: 8px 0; white-space: pre-wrap; }
  .fin-stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim);
               font-size: 12px; border-top: 1px solid var(--line);
               padding-top: 8px; margin-top: 6px; }
  .fin-stats b { color: var(--fg); font-family: var(--mono); }

  /* ---------- 底部输入区 ---------- */
  #composer {
    flex-shrink: 0; border-top: 1px solid var(--line);
    background: var(--panel); padding: 14px 20px 18px;
  }
  #composer .inner { max-width: 900px; margin: 0 auto;
                     display: flex; gap: 10px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 12px;
    color: var(--fg); font: 14px/1.5 inherit; padding: 11px 14px;
    max-height: 160px; outline: none;
  }
  #input:focus { border-color: var(--info); }
  #input:disabled { opacity: .5; }
  #send {
    background: var(--user); color: #fff; border: none; border-radius: 12px;
    width: 44px; height: 44px; font-size: 17px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { opacity: .4; cursor: default; }
  #stop {
    background: #da3633; color: #fff; border: none; border-radius: 12px;
    height: 44px; width: 44px; padding: 0; cursor: pointer; flex-shrink: 0;
    position: relative;
  }
  #stop::before {
    content: "";
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 14px; height: 14px;
    background: #fff; border-radius: 2px;
  }
  #stop:hover { background: #b62b28; }
  #stop:disabled { opacity: .5; cursor: default; }
  #hint { max-width: 900px; margin: 6px auto 0; color: var(--faint);
          font-size: 11.5px; text-align: center; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
<!-- Markdown 渲染：模型输出展示富文本。离线时自动降级为纯文本 -->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body>

<aside id="sidebar">
  <div class="sb-top">
    <div class="sb-title">会话</div>
    <button id="btn-new">＋ 新会话</button>
  </div>
  <ul id="sess-list"></ul>
  <div class="sb-foot" id="sb-ws">—</div>
</aside>

<div id="main">
<header>
  <div class="brand"><b>⚡ CodingAgent</b><span>workbench</span></div>
  <div class="meta">
    <span>模型 <b id="h-model">…</b></span>
    <span>工作区 <b id="h-ws">…</b></span>
    <span>会话 <b id="h-session">…</b></span>
  </div>
  <div class="spacer"></div>
  <button id="btn-auto" title="写操作不再逐项询问（高危命令仍拦截）">确认模式</button>
</header>

<div id="statsbar">
  <div class="stat">状态<b id="st-state" class="idle">空闲</b></div>
  <div class="stat">轮次<b id="st-turns">0</b></div>
  <div class="stat">工具调用<b id="st-tools">0</b></div>
  <div class="stat">耗时<b id="st-elapsed">0.0s</b></div>
  <div class="stat">上下文<b id="st-tokens">0</b></div>
  <div class="stat">被拒操作<b id="st-denied">0</b></div>
</div>

<div id="chat"><div class="wrap" id="feed"></div></div>

<div id="composer">
  <div class="inner">
    <textarea id="input" rows="1"
      placeholder="描述任务，回车发送 · Shift+回车换行"></textarea>
    <button id="stop" title="停止任务" hidden></button>
    <button id="send" title="发送">➤</button>
  </div>
  <div id="hint">写操作默认需确认（y 允许 · n 拒绝 · a 本次会话全部允许）</div>
</div>
</div><!-- /#main -->

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed"), chatEl = $("chat"), input = $("input");

/* Markdown 渲染（模型输出富文本）；marked/DOMPurify 未加载则降级纯文本 */
try { if (window.marked) marked.setOptions({ breaks: true, gfm: true }); } catch (_) {}
function mdHtml(text) {
  if (window.marked && window.DOMPurify && (text || "").trim()) {
    try {
      return '<div class="md">' + DOMPurify.sanitize(marked.parse(text)) + '</div>';
    } catch (_) {}
  }
  return '<div class="md md-fallback">' + esc(text || "") + '</div>';
}

/* 把模型气泡里累积的纯文本渲染为 markdown（仅在关闭/收尾时做一次，避免流式闪烁） */
function renderModelMarkdown(bubble) {
  if (!bubble || bubble._md) return;
  const txt = bubble.querySelector(".txt");
  if (!txt) return;
  const raw = txt.textContent;
  if (!raw.trim()) return;
  const cur = bubble.querySelector(".cursor"); if (cur) cur.remove();
  const box = document.createElement("div");
  box.innerHTML = mdHtml(raw);
  const node = box.firstChild;
  if (node) txt.replaceWith(node);
  bubble._md = true;
}

const state = {
  running: false, auto: false, turns: 0, tools: 0, denied: 0,
  replaying: false, stopped: false,   // stopped: 已点停止，等待旧任务收尾中
  discardUntilTaskEnd: false,          // 停止后丢弃旧任务继续冒出的 delta/assistant
  taskT0: null, timer: null, lastSeq: -1,
  modelEl: null,          // 当前流式模型气泡
  toolCards: new Map(),   // call_id -> 卡片元素
  confirmCards: new Map(),
  askCards: new Map(),
};

/* ---------------- 工具函数 ---------------- */
const esc = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtMs(ms) {
  if (ms < 1000) return ms + "ms";
  if (ms < 60000) return (ms / 1000).toFixed(1) + "s";
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
  return m + "m" + String(s).padStart(2, "0") + "s";
}
function fmtTokens(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + "K" : String(n);
}
function nearBottom() {
  return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 120;
}
/* 自动跟随：内容生成时滚到底部，但用户主动上滑查看历史时不强行拉回；
   用户滚回底部附近即恢复跟随。比每次都测 nearBottom 更稳定。 */
let autoFollow = true;
chatEl.addEventListener("scroll", () => { autoFollow = nearBottom(); });
function scrollDown(force) {
  if (force || autoFollow) chatEl.scrollTop = chatEl.scrollHeight;
}
function briefArgs(name, args) {
  if (!args || typeof args !== "object") return "";
  if (name === "run_command") return args.cmd || "";
  if (name === "run_tests") return args.path || "整个工作区";
  if (args.path) return args.path + (args.pattern ? " · " + args.pattern : "");
  if (args.pattern) return args.pattern;
  try { return JSON.stringify(args); } catch { return ""; }
}

/* ---------------- 统计与状态 ---------------- */
function setRunning(on) {
  state.running = on;
  input.disabled = on; $("send").disabled = on;
  /* 运行中显示"停止"、隐藏"发送"；空闲时反之 */
  $("stop").hidden = !on; $("send").style.display = on ? "none" : "";
  input.placeholder = on ? "任务执行中，请稍候…" : "描述任务，回车发送 · Shift+回车换行";
  const el = $("st-state");
  el.textContent = on ? "● 运行中" : "空闲";
  el.className = on ? "run" : "idle";
  if (on && !state.taskT0) {
    state.taskT0 = Date.now();
    state.timer = setInterval(() => {
      if (state.taskT0)
        $("st-elapsed").textContent = fmtMs(Date.now() - state.taskT0);
    }, 200);
  } else if (!on && state.timer) {
    clearInterval(state.timer); state.timer = null;
  }
}
function bump(k, v) { $(k).textContent = v; }

/* ---------------- 渲染：各类事件 ---------------- */
function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstChild;
}

function addUserMsg(text) {
  feed.appendChild(el(`<div class="msg-user">${esc(text)}</div>`));
  scrollDown(true);
}

function closeModelBubble() {
  if (state.modelEl) renderModelMarkdown(state.modelEl);
  state.modelEl = null;
}

function ensureModelBubble() {
  if (!state.modelEl) {
    const d = el(`<div class="msg-model"><span class="tag">GLM</span>` +
                 `<span class="txt"></span><span class="cursor"></span></div>`);
    feed.appendChild(d);
    state.modelEl = d;
  }
  return state.modelEl;
}

function addTurnDivider(n) {
  closeModelBubble();
  feed.appendChild(el(`<div class="turn-divider">第 ${n} 轮</div>`));
  state.turns = n; bump("st-turns", n);
}

/* ---- 工具卡片 ---- */
function toolCard(p) {
  const id = (p.call_id !== undefined) ? p.call_id : ("k" + state.tools);
  let card = state.toolCards.get(id);
  if (!card) {
    card = el(`<div class="tool"><div class="tool-head">` +
      `<span class="spin"></span><span class="tool-name">${esc(p.name)}</span>` +
      `<span class="tool-args">${esc(briefArgs(p.name, p.args))}</span>` +
      `<span class="tool-status">执行中…</span></div>` +
      `<div class="tool-body"></div></div>`);
    feed.appendChild(card);
    state.toolCards.set(id, card);
  }
  return card;
}

/* 构建 unified diff 高亮（按行着色）。maxLines 为 null 时输出全部；
   否则只渲染色前 maxLines 行（用于折叠预览） */
function buildDiffBody(text, maxLines) {
  const lines = text.split("\n");
  const holder = document.createElement("div");
  lines.forEach((ln, i) => {
    let c = "";
    if (ln.startsWith("+++") || ln.startsWith("---")) c = "meta";
    else if (ln.startsWith("@@")) c = "hunk";
    else if (ln.startsWith("+")) c = "add";
    else if (ln.startsWith("-")) c = "del";
    if (i === 0 || c) {                       // 始终保留首行 + 着色行
      if (maxLines != null && i >= maxLines) return;
      const sp = document.createElement("span");
      sp.className = "diff-line " + c;
      sp.textContent = ln;
      holder.appendChild(sp);
    }
  });
  return holder;
}

function renderToolEnd(p) {
  const id = (p.call_id !== undefined) ? p.call_id : "k" + state.tools;
  const card = state.toolCards.get(id) || (() => {
    const c = toolCard({ name: p.name, args: {}, call_id: p.call_id });
    return state.toolCards.get(id) || c;
  })();
  if (!card) return;
  closeModelBubble();

  const result = p.result || "";
  const dur = fmtMs(p.duration_ms || 0);
  state.tools += 1; bump("st-tools", state.tools);

  const head = card.querySelector(".tool-head");
  const name = p.name || "";
  let cls = "ok", icon = "✓";
  if (result.startsWith("[error]"))     { cls = "err";   icon = "✗"; }
  else if (result.startsWith("[blocked]")) { cls = "block"; icon = "⛔"; }
  card.className = "tool " + cls;
  head.innerHTML =
    `<span style="font-family:var(--mono);color:var(--${cls === "ok" ? "ok" : cls === "err" ? "err" : "warn"});">${icon}</span>` +
    `<span class="tool-name">${esc(name)}</span>` +
    `<span class="tool-args">${esc(head.querySelector(".tool-args")?.textContent || "")}</span>` +
    `<span class="tool-status" style="color:var(--dim)">${dur}</span>`;

  const body = card.querySelector(".tool-body");
  body.innerHTML = "";

  /* 测试统计徽章（run_tests 或含 pytest 统计行） */
  const m = result.match(/(\d+)\s+passed|(\d+)\s+failed|(\d+)\s+error/g);
  if (name === "run_tests" || (m && m.length >= 1 && /passed/.test(result))) {
    const badges = [];
    const pp = result.match(/(\d+)\s+passed/), ff = result.match(/(\d+)\s+failed/),
          ee = result.match(/(\d+)\s+error/);
    if (pp) badges.push(`<span class="badge pass">✓ ${pp[1]} passed</span>`);
    if (ff) badges.push(`<span class="badge fail">✗ ${ff[1]} failed</span>`);
    if (ee) badges.push(`<span class="badge warn">⚠ ${ee[1]} error</span>`);
    if (badges.length) {
      body.appendChild(el(`<div class="badges">${badges.join("")}</div>`));
    }
  }

  /* diff 高亮（edit_file / apply_patch 的 unified diff） */
  if (result.includes("\n@@") || result.includes("@@ ")) {
    const lines = result.split("\n");
    const addN = lines.filter(l => l.startsWith("+") && !l.startsWith("+++")).length;
    const delN = lines.filter(l => l.startsWith("-") && !l.startsWith("---")).length;
    const PREVIEW = 20;                       // 默认预览前 20 行
    /* 行数统计徽章：所有 diff 都展示（不止折叠时） */
    body.appendChild(el(
      `<div class="diff-sum">` +
      `<span class="badge add">+${addN} 新增</span>` +
      `<span class="badge del">-${delN} 删除</span>` +
      `</div>`));
    if (lines.length <= PREVIEW) {
      body.appendChild(buildDiffBody(result, null));
    } else {
      body.appendChild(buildDiffBody(result, PREVIEW));
      const det = el(
        `<details class="fold">` +
        `<summary>展开完整 Diff（共 ${lines.length} 行）</summary>` +
        `</details>`);
      det.appendChild(buildDiffBody(result, null));
      body.appendChild(det);
    }
  } else if (result) {
    /* 普通文本输出：markdown 渲染 + 长输出折叠 */
    const lines = result.split("\n");
    const preview = document.createElement("div");
    preview.innerHTML = mdHtml(lines.slice(0, 14).join("\n"));
    if (preview.firstChild) body.appendChild(preview.firstChild);
    if (lines.length > 14) {
      const det = el(`<details class="fold"><summary>展开全部输出（共 ${lines.length} 行）</summary></details>`);
      const full = document.createElement("div");
      full.innerHTML = mdHtml(result);
      if (full.firstChild) det.appendChild(full.firstChild);
      body.appendChild(det);
    }
  }
  scrollDown();
}

/* ---- 确认卡片 ---- */
function addConfirm(p) {
  const card = el(`<div class="card-confirm">` +
    `<div class="ttl">⚠ 安全确认 · ${esc(p.tool)}</div>` +
    `<div class="why">${esc(p.reason || "该操作需要你的许可")}</div>` +
    `<div class="args">${esc(p.args || "")}</div>` +
    `<div class="btns"><button class="allow">允许 (y)</button>` +
    `<button class="deny">拒绝 (n)</button>` +
    `<button class="all">本次会话全部允许 (a)</button></div>` +
    `<div class="verdict"></div></div>`);
  const [by, bn, ba] = card.querySelectorAll("button");
  const decide = (ans) => {
    by.disabled = bn.disabled = ba.disabled = true;
    fetch("/api/decision", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id: p.id, answer: ans }) });
  };
  by.onclick = () => decide("y");
  bn.onclick = () => decide("n");
  ba.onclick = () => decide("a");
  feed.appendChild(card);
  state.confirmCards.set(p.id, card);
  scrollDown(true);
}
function markConfirm(p) {
  const card = state.confirmCards.get(p.id);
  if (!card) return;
  const v = card.querySelector(".verdict");
  v.className = "verdict " + (p.approved ? "yes" : "no");
  v.textContent = p.approved ? "✔ 已允许" : "✘ 已拒绝";
}

/* ---- 问答卡片 ---- */
function addAsk(p) {
  const card = el(`<div class="card-ask"><div class="ttl">💬 智能体提问</div>` +
    `<div class="q">${esc(p.question)}</div>` +
    `<div class="ask-row"><input placeholder="输入你的回答…">` +
    `<button>发送</button></div></div>`);
  const [inp, btn] = [card.querySelector("input"), card.querySelector("button")];
  const send = () => {
    const val = inp.value.trim(); if (!val) return;
    inp.disabled = btn.disabled = true;
    fetch("/api/answer", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id: p.id, answer: val }) });
  };
  btn.onclick = send;
  inp.onkeydown = (e) => { if (e.key === "Enter") send(); };
  feed.appendChild(card);
  state.askCards.set(p.id, card);
  scrollDown(true); inp.focus();
}
function markAsk(p) {
  const card = state.askCards.get(p.id);
  if (card && p.answer) {
    const inp = card.querySelector("input");
    if (inp && !inp.disabled) { inp.value = p.answer; inp.disabled = true; }
  }
}

/* ---- 最终摘要 ---- */
function addFinish(p) {
  closeModelBubble();
  const card = el(    `<div class="card-finish">` +
    `<div class="ttl">✔ 任务完成</div>` +
    `${mdHtml(p.summary || "")}` +
    `<div class="fin-stats">` +
    `<span>轮次 <b>${state.turns}</b></span>` +
    `<span>工具调用 <b>${state.tools}</b></span>` +
    `<span>耗时 <b>${fmtMs(p.elapsed_ms || 0)}</b></span>` +
    `<span>上下文 <b>${fmtTokens(lastTokens)}</b> tokens</span>` +
    `</div></div>`);
  feed.appendChild(card);
  scrollDown(true);
}

/* ---------------- 事件分发 ---------------- */
let lastTokens = 0;

function handleEvent(e) {
  const k = e.kind, p = e.payload || {};
  switch (k) {
    case "user":        addUserMsg(p.message);
                        if (!state.replaying) {
                          setRunning(true);
                          state.turns = state.tools = 0;
                          state.stopped = false;
                          bump("st-turns", 0); bump("st-tools", 0);
                          $("st-elapsed").textContent = "0.0s";
                        }
                        break;
    case "turn_start":  addTurnDivider(p.turn); break;
    case "delta":       if (state.discardUntilTaskEnd) break;
                          { const b = ensureModelBubble();
                            b.querySelector(".txt").textContent += p.text;
                            scrollDown(); break; }
    case "assistant":   if (state.discardUntilTaskEnd) break;
                          { const txt = p.content || "";
                            if (txt) { const b = ensureModelBubble();
                                       const t = b.querySelector(".txt");
                                       if (!t.textContent) t.textContent = txt; }
                            closeModelBubble(); scrollDown(); break; }
    case "tool_start":  toolCard(p); scrollDown(); break;
    case "tool_end":    renderToolEnd(p); break;
    case "confirm_request": addConfirm(p); break;
    case "confirm_result":  markConfirm(p); break;
    case "ask_request":     addAsk(p); break;
    case "ask_result":      markAsk(p); break;
    case "denied":     state.denied += 1; bump("st-denied", state.denied);
                       feed.appendChild(el(
                         `<div class="alert warning">⛔ 高危操作已拦截：${esc(p.tool)} — ${esc(p.reason || "")}</div>`));
                       scrollDown(); break;
    case "error":      feed.appendChild(el(
                         `<div class="alert error">✘ ${esc(p.message)}</div>`));
                       scrollDown(true); break;
    case "warning":    feed.appendChild(el(
                         `<div class="alert warning">⚠ ${esc(p.message)}</div>`));
                       scrollDown(); break;
    case "session":    state.replaying = false;
                       feed.appendChild(el(
                         `<div class="alert session">— ${esc(p.message)} —</div>`));
                       scrollDown();
                       if (!state.running) setRunning(false); break;
    case "cancel":     if (state.stopped) break;   // 停止提示已由点击时展示，去重
                       state.stopped = true;
                       feed.appendChild(el(
                         `<div class="alert cancel">⏹ ${esc(p.message || "任务已取消")} · 可直接输入新任务继续</div>`));
                       scrollDown(true); break;
    case "finish":     break;   /* 摘要在 task_end 里统一出 */
    case "task_end":   /* 取消返回的摘要以 [已取消] 开头，不渲染"完成"卡片 */
                       state.discardUntilTaskEnd = false;
                       if (p.summary && !String(p.summary).startsWith("[已取消]"))
                         addFinish(p);
                       if (state.taskT0) {
                         $("st-elapsed").textContent = fmtMs(p.elapsed_ms || 0);
                         state.taskT0 = null;
                       }
                       if (state.timer) { clearInterval(state.timer);
                                          state.timer = null; }
                       setRunning(false); break;
  }
}

/* ---------------- SSE / API ---------------- */
/* 当前 SSE 连接句柄；新会话会换掉服务端事件总线，必须重连以重置游标 */
let es = null;
function connectSSE(after) {
  if (es) { try { es.close(); } catch (_) {} es = null; }
  es = new EventSource("/api/events?after=" + after);
  es.onmessage = (ev) => {
    try {
      const e = JSON.parse(ev.data);
      if (e.seq > state.lastSeq) state.lastSeq = e.seq;
      handleEvent(e);
    } catch (_) {}
  };
  es.onerror = () => {
    if (es) { try { es.close(); } catch (_) {} es = null; }
    setTimeout(() => connectSSE(state.lastSeq), 1500);
  };
}

async function refreshState(opts) {
  opts = opts || {};
  const replayEvents = opts.replayEvents !== false && state.lastSeq < 0;
  try {
    const st = await (await fetch("/api/state")).json();
    $("h-model").textContent = st.model;
    $("h-ws").textContent = st.workspace.split("/").pop() || st.workspace;
    $("sb-ws").textContent = st.workspace.split("/").pop() || st.workspace;
    $("h-session").textContent = (st.stats.session_file || "").split("/").pop() || "—";
    state.auto = st.auto;
    const ab = $("btn-auto");
    ab.textContent = st.auto ? "自动确认中" : "确认模式";
    ab.classList.toggle("on", st.auto);
    if (!st.running) setRunning(false);
    lastTokens = st.stats.tokens_estimated || 0;
    bump("st-tokens", fmtTokens(lastTokens));
    bump("st-denied", st.stats.denied || 0);
    if (st.stats.turns && !state.running) bump("st-turns", st.stats.turns);
    if (st.stats.elapsed_ms && !state.running)
      $("st-elapsed").textContent = fmtMs(st.stats.elapsed_ms);
    /* 回放历史事件（页面刷新后）。切换/删除会话时由 SSE 回放，不在此处以免双重 */
    if (replayEvents && st.events && st.events.length) {
      st.events.forEach(handleEvent);
      state.lastSeq = st.events[st.events.length - 1].seq;
      if (!st.running) setRunning(false);
    }
  } catch (_) {}
}

async function send() {
  const text = input.value.trim();
  if (!text || state.running) return;
  input.value = ""; input.style.height = "auto";
  /* 协作式取消：停止后旧任务会在"下一个步骤边界"前终止，期间可能仍需数秒
     （正在进行的模型生成 / 工具会先跑完）。后端在此期间返回 409，前端平滑退避
     重试，并以一条中性的"正在停止…"提示代替报错——停止后用户可立即输入、无感续跑，
     绝不弹"任务忙"。 */
  let hint = null;
  for (let attempt = 0; attempt < 140; attempt++) {
    const r = await fetch("/api/task", { method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text }) });
    if (r.ok) {
      if (hint) { hint.remove(); hint = null; }
      state.stopped = false; return;
    }
    if (r.status === 409) {
      if (!hint) {
        hint = el(`<div class="alert session" id="stopping-hint">⏳ 正在停止上一个任务，请稍候…</div>`);
        feed.appendChild(hint); scrollDown(true);
      }
      await new Promise(res => setTimeout(res, 200)); continue;
    }
    const j = await r.json().catch(() => ({}));
    feed.appendChild(el(`<div class="alert error">✘ ${esc(j.message || "提交失败")}</div>`));
    scrollDown(true);
    return;
  }
  feed.appendChild(el(`<div class="alert error">✘ 上一个任务迟迟未停止，请刷新页面后重试</div>`));
  scrollDown(true);
}

/* ---------------- 会话列表：展示 / 切换 / 删除 ---------------- */
async function loadSessions() {
  try {
    const list = await (await fetch("/api/sessions")).json();
    const ul = $("sess-list");
    ul.innerHTML = "";
    list.forEach((s) => {
      const li = document.createElement("li");
      li.className = "sess" + (s.current ? " active" : "");
      const t = document.createElement("div");
      t.className = "sess-title"; t.textContent = s.title;
      const mt = document.createElement("div");
      mt.className = "sess-meta";
      mt.textContent = s.messages + " 条 · " + new Date(s.mtime).toLocaleString();
      li.appendChild(t); li.appendChild(mt);
      li.onclick = () => switchSession(s.id);
      const del = document.createElement("button");
      del.className = "sess-del"; del.textContent = "✕"; del.title = "删除会话";
      del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
      li.appendChild(del);
      ul.appendChild(li);
    });
  } catch (_) {}
}

async function switchSession(id) {
  if (state.running) return;
  await fetch("/api/session/switch", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id }) });
  feed.innerHTML = ""; state.toolCards.clear();
  state.confirmCards.clear(); state.askCards.clear();
  state.turns = state.tools = state.denied = 0; state.lastSeq = -1;
  bump("st-turns", 0); bump("st-tools", 0); bump("st-denied", 0);
  $("st-elapsed").textContent = "0.0s";
  state.replaying = true;
  await refreshState({ replayEvents: false });
  connectSSE(state.lastSeq);
  loadSessions();
}

async function deleteSession(id) {
  if (state.running) return;
  const j = await (await fetch("/api/session/delete", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({ id }) })).json();
  if (j.current_deleted) {
    feed.innerHTML = ""; state.toolCards.clear();
    state.confirmCards.clear(); state.askCards.clear();
    state.turns = state.tools = state.denied = 0; state.lastSeq = -1;
    bump("st-turns", 0); bump("st-tools", 0); bump("st-denied", 0);
    $("st-elapsed").textContent = "0.0s";
    await refreshState({ replayEvents: false });
    connectSSE(state.lastSeq);
  }
  loadSessions();
}

/* ---------------- 交互绑定 ---------------- */
$("send").onclick = send;
$("stop").onclick = async () => {
  if (!state.running) return;
  try {
    const r = await fetch("/api/stop", { method: "POST" });
    if (r.ok) {
      /* 立刻释放输入：不等任务真正收尾，用户可马上输入新任务续跑。
         协作式取消下当前这轮 LLM 生成还会继续返回事件；关闭当前气泡并
         丢弃旧任务后续冒出的 delta/assistant，避免它们再开新气泡导致重复输出。 */
      setRunning(false);
      closeModelBubble();
      state.stopped = true;
      state.discardUntilTaskEnd = true;
      feed.appendChild(el(
        `<div class="alert cancel">⏹ 已停止 · 可直接输入新任务继续</div>`));
      scrollDown(true);
    }
  } catch (_) {}
};
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
$("btn-new").onclick = async () => {
  if (state.running) return;
  await fetch("/api/new", { method: "POST" });
  feed.innerHTML = ""; state.toolCards.clear();
  state.confirmCards.clear(); state.askCards.clear();
  state.turns = state.tools = state.denied = 0; state.lastSeq = -1;
  bump("st-turns", 0); bump("st-tools", 0); bump("st-denied", 0);
  $("st-elapsed").textContent = "0.0s";
  await refreshState();
  /* 关键修复：新会话会重建服务端事件总线并重置 seq，旧的 SSE 游标(after)
     仍停在旧会话导致后续事件全部被丢弃。必须重连 SSE 让游标从新总线起点开始 */
  connectSSE(state.lastSeq);
  loadSessions();
};
$("btn-auto").onclick = async () => {
  const r = await fetch("/api/auto", { method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ on: !state.auto }) });
  const j = await r.json();
  state.auto = j.auto;
  const ab = $("btn-auto");
  ab.textContent = j.auto ? "自动确认中" : "确认模式";
  ab.classList.toggle("on", j.auto);
};

/* ---------------- 启动 ---------------- */
refreshState().then(() => { connectSSE(state.lastSeq); loadSessions(); });
setInterval(refreshState, 5000);
setInterval(loadSessions, 5000);
input.focus();
</script>
</body>
</html>
